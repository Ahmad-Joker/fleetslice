[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetslice"
version = "0.1.0"
description = "Paired, slice-aware regression testing for motion forecasts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ahmad Essam Abdelaziz"}]
dependencies = ["numpy>=2.1,<3"]

[project.optional-dependencies]
av2 = ["pandas>=2.2,<3", "pyarrow>=18,<24"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
fleetslice = "fleetslice.cli:main"

[tool.setuptools.package-data]
fleetslice = ["report_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

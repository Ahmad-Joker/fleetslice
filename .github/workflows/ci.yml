name: FleetSlice checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,av2]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
      - name: Exercise expected regression gate
        shell: bash
        run: |
          fleetslice demo --out /tmp/fixture
          set +e
          fleetslice evaluate --data /tmp/fixture/scenes.jsonl --baseline /tmp/fixture/baseline.jsonl --candidate /tmp/fixture/candidate.jsonl --out /tmp/report
          status=$?
          set -e
          test "$status" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ matrix.python }}
          path: /tmp/report
          retention-days: 14
